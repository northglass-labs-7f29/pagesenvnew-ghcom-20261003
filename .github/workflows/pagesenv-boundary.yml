name: pagesenv-boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Digest protected canary
        env:
          PAGESENV_CANARY: ${{ secrets.PAGESENV_CANARY }}
        run: |
          if [ -z "$PAGESENV_CANARY" ]; then exit 2; fi
          printf 'PAGESENV_DIGEST='
          printf '%s' "$PAGESENV_CANARY" | sha256sum | cut -d' ' -f1
